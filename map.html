<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Network Map</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        #map-container {
            flex-grow: 1;
            position: relative;
            height: 100%;
        }
        /* সাইডবার স্টাইল */
        #sidebar {
            width: 280px;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            padding: 16px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: -4px 0 15px rgba(0,0,0,0.03);
            z-index: 10;
        }
        #sidebar.active {
            display: flex;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #64748b;
        }
    </style>
</head>
<body>

<div id="map-container">
    <h2 class="sr-only">World map showing Rimo Global Pharma export presence</h2>
    <div style="padding:4px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:13px;color:#64748b" id="count-label">exporting to 40 countries</span>
        </div>
        <div id="map" style="width:100%;position:relative;border:0.5px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#ffffff"></div>
        <div style="display:flex;gap:12px;margin-top:8px;font-size:12px;color:#64748b;flex-wrap:wrap">
            <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75"></span>exporting</span>
            <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#7F77DD"></span>future plan</span>
            <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#D85A30"></span>hub (BD)</span>
        </div>
    </div>
</div>

<!-- ডানপাশের ইনফো সাইডবার -->
<div id="sidebar">
    <div>
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f1f5f9; padding-bottom:8px; margin-bottom:12px;">
            <h3 id="country-name" style="margin:0; font-size:16px; font-weight:800; color:#0f172a;">Country</h3>
            <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="country-badge" style="display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; margin-bottom:12px;"></div>
        <div style="font-size:12px; color:#64748b; display:flex; justify-content:space-between; margin-bottom:6px;">
            <span>Region</span>
            <strong style="color:#0f172a;">Global Network</strong>
        </div>
        <div style="font-size:12px; color:#64748b; display:flex; justify-content:space-between; margin-bottom:12px;">
            <span>Network Status</span>
            <strong id="country-status" style="color:#0f172a;">Active</strong>
        </div>
        <p id="country-desc" style="font-size:11px; color:#475569; line-height:1.4; margin-top:8px;"></p>
    </div>
    <a id="action-btn" href="#products-section" target="_top" style="display:block; text-align:center; background:#0088cc; color:#ffffff; padding:8px; border-radius:8px; font-size:12px; font-weight:bold; text-decoration:none;">View Products</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const EXPORTING = ["India","Pakistan","Nepal","Sri Lanka","Myanmar","Malaysia","Indonesia","Philippines","Vietnam","Cambodia","United Arab Emirates","Saudi Arabia","Qatar","Oman","Yemen","Turkey","Ukraine","Georgia","Armenia","Azerbaijan","Serbia","Bosnia and Herz.","Kenya","Uganda","Tanzania","Nigeria","South Africa","Ghana","Ethiopia","Sudan","Somalia","Rwanda","Zambia","Zimbabwe","Malawi","Mozambique","Senegal","Egypt","Morocco","Algeria"];
const AFRICA_ALL = ["Tanzania","W. Sahara","Dem. Rep. Congo","Somalia","Kenya","Sudan","Chad","South Africa","Lesotho","Zimbabwe","Botswana","Namibia","Senegal","Mali","Mauritania","Benin","Niger","Nigeria","Cameroon","Togo","Ghana","Cote d'Ivoire","Côte d'Ivoire","Guinea","Guinea-Bissau","Liberia","Sierra Leone","Burkina Faso","Central African Rep.","Congo","Gabon","Eq. Guinea","Zambia","Malawi","Mozambique","eSwatini","Angola","Burundi","Madagascar","Tunisia","Algeria","Morocco","Libya","Egypt","Ethiopia","Djibouti","Somaliland","Uganda","Rwanda","S. Sudan","Eritrea","Gambia"];
const ASIA_ALL = ["Kazakhstan","Uzbekistan","Indonesia","Israel","Lebanon","Palestine","Jordan","United Arab Emirates","Qatar","Kuwait","Iraq","Oman","Cambodia","Thailand","Laos","Myanmar","Vietnam","North Korea","South Korea","Mongolia","India","Bangladesh","Bhutan","Nepal","Pakistan","Afghanistan","Tajikistan","Kyrgyzstan","Turkmenistan","Iran","Syria","Armenia","China","Taiwan","Azerbaijan","Georgia","Philippines","Malaysia","Brunei","Sri Lanka","Japan","Yemen","Saudi Arabia","Cyprus","N. Cyprus","Timor-Leste"];
const EUROPE_SOME = ["Turkey","Ukraine","Serbia","Bosnia and Herz.","Albania","Moldova","Kosovo"];
const exportSet = new Set(EXPORTING);
const futureSet = new Set([...AFRICA_ALL,...ASIA_ALL,...EUROPE_SOME].filter(n => !exportSet.has(n) && n !== "Bangladesh"));

const width = 900, height = 340;
const svg = d3.select('#map').append('svg').attr('viewBox','0 0 '+width+' '+height).attr('width','100%').style('display','block');
const g = svg.append('g');
const projection = d3.geoNaturalEarth1().scale(120).translate([width/2, height/2 + 5]);
const path = d3.geoPath(projection);

const tooltip = d3.select('#map').append('div').style('position','absolute').style('pointer-events','none')
  .style('background','#f8fafc').style('border','0.5px solid #cbd5e1').style('border-radius','6px')
  .style('padding','4px 8px').style('font-size','11px').style('color','#0f172a').style('opacity','0').style('z-index','5');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
  const countries = topojson.feature(world, world.objects.countries).features;
  g.selectAll('path').data(countries).join('path')
    .attr('d', path)
    .style('stroke', '#f1f5f9')
    .style('stroke-width', 0.5)
    .attr('fill', d => {
      const name = d.properties.name;
      if (name === 'Bangladesh') return '#D85A30';
      if (exportSet.has(name)) return '#1D9E75';
      if (futureSet.has(name)) return '#7F77DD';
      return '#e2e8f0';
    })
    .style('cursor', d => d.properties.name === 'Bangladesh' || exportSet.has(d.properties.name) || futureSet.has(d.properties.name) ? 'pointer' : 'default')
    .on('mousemove', function(event, d) {
      const name = d.properties.name;
      let label = null;
      if (name === 'Bangladesh') label = name + ' — export hub';
      else if (exportSet.has(name)) label = name + ' — exporting';
      else if (futureSet.has(name)) label = name + ' — future plan';
      if (!label) { tooltip.style('opacity','0'); return; }
      const rect = document.getElementById('map').getBoundingClientRect();
      tooltip.style('opacity','1').text(label)
        .style('left', (event.clientX - rect.left + 10) + 'px')
        .style('top', (event.clientY - rect.top + 5) + 'px');
    })
    .on('mouseleave', () => tooltip.style('opacity','0'))
    .on('click', function(event, d) {
      const name = d.properties.name;
      if (name === 'Bangladesh' || exportSet.has(name) || futureSet.has(name)) {
        showSidebar(name);
      }
    });
});

function showSidebar(name) {
    const sidebar = document.getElementById('sidebar');
    const title = document.getElementById('country-name');
    const badge = document.getElementById('country-badge');
    const status = document.getElementById('country-status');
    const desc = document.getElementById('country-desc');

    title.innerText = name;
    sidebar.classList.add('active');

    if (name === 'Bangladesh') {
        badge.innerText = 'EXPORT HUB';
        badge.style.background = '#fef2f2';
        badge.style.color = '#D85A30';
        status.innerText = 'Main Hub';
        desc.innerText = 'Bangladesh is our primary operational and export hub for high-quality oncology and specialty medicines.';
    } else if (exportSet.has(name)) {
        badge.innerText = 'EXPORTING COUNTRY';
        badge.style.background = '#f0fdf4';
        badge.style.color = '#1D9E75';
        status.innerText = 'Active Market';
        desc.innerText = `Rimo Global Pharma actively exports certified oncology and specialty medicines to ${name}.`;
    } else if (futureSet.has(name)) {
        badge.innerText = 'FUTURE PLAN';
        badge.style.background = '#f5f3ff';
        badge.style.color = '#7F77DD';
        status.innerText = 'Planned Market';
        desc.innerText = `This country is included in the future expansion plan of Rimo Global Pharma's global network.`;
    }
}

function closeSidebar() {
    document.getElementById('sidebar').classList.remove('active');
}
</script>
</body>
</html>
