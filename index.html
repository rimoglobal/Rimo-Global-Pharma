<style>
.floating-chat-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: sans-serif;
}
.chat-toggle-btn {
    width: 60px;
    height: 60px;
    background-color: #25d366;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    transition: transform 0.3s ease;
}
.chat-toggle-btn:hover {
    transform: scale(1.05);
}
.chat-options-list {
    position: absolute;
    bottom: 75px;
    right: 5px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.3s ease;
}
.chat-options-list.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
.chat-option-item {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s;
    text-decoration: none;
}
.chat-option-item:hover {
    transform: scale(1.1);
}
.chat-option-item.phone { background-color: #007bff; }
.chat-option-item.whatsapp { background-color: #25d366; }
.chat-option-item.messenger { background-color: #0084ff; }
.chat-option-item.email { background-color: #ea4335; }
</style>

<script>
const chatToggle = document.getElementById('chatToggle');
const chatOptions = document.getElementById('chatOptions');
const chatIcon = chatToggle.querySelector('.chat-icon');
const closeIcon = chatToggle.querySelector('.close-icon');

chatToggle.addEventListener('click', () => {
    chatOptions.classList.toggle('active');
    if(chatOptions.classList.contains('active')) {
        chatIcon.style.display = 'none';
        closeIcon.style.display = 'block';
    } else {
        chatIcon.style.display = 'block';
        closeIcon.style.display = 'none';
    }
});
</script>
<!-- Floating Contact Widget End -->
