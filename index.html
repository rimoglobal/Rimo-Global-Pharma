<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimo Global Pharma Ltd</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Slider / Images */
        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-slide.active {
            opacity: 1;
        }

        /* Dark Overlay */
        .hero-slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Content Boxes */
        .main-title-box {
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .main-title-box h1 {
            color: #0099ff;
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .sub-title-box {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 20, 0.85);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .sub-title-box p {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-title-box h1 {
                font-size: 2.2rem;
            }
            .main-title-box {
                padding: 20px;
            }
            .sub-title-box p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Slide 1 -->
        <div class="hero-slide active" style="background-image: url('image1.jpg');">
            <div class="main-title-box">
                <h1>Rimo Global Pharma Ltd</h1>
            </div>
            <div class="sub-title-box">
                <p>Global Supplier of WHO-GMP Certified Oncology Medicines</p>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="hero-slide" style="background-image: url('image2.jpg');">
            <div class="main-title-box">
                <h1>End-To-End Pharma Sourcing</h1>
            </div>
            <div class="sub-title-box">
                <p>Connecting Healthcare Demands Globally</p>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="hero-slide" style="background-image: url('image3.jpg');">
            <div class="main-title-box">
                <h1>Accessible Global Healthcare</h1>
            </div>
            <div class="sub-title-box">
                <p>Facilitating Procurement & Export Logistics</p>
            </div>
        </div>
    </div>

    <script>
        // Optional automatic slide switcher script
        let currentSlide = 0;
        const slides = document.querySelectorAll('.hero-slide');

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 4000); // Change slide every 4 seconds
    </script>

</body>
</html>
