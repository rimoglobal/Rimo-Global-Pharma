<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimo Global Pharma Ltd</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
        }

        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hero Slides */
        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-slide.active {
            opacity: 1;
        }

        /* Dark Overlay for better contrast */
        .hero-slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        /* Main Title Box */
        .main-title-box {
            position: relative;
            z-index: 2;
            background: rgba(20, 18, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 35px 50px;
            border-radius: 14px;
            max-width: 950px;
            width: 100%;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .main-title-box h1 {
            color: #0099ff;
            font-size: 3.8rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.15;
            letter-spacing: 1.5px;
        }

        /* Sub Title Box - Fixed width and padding */
        .sub-title-box {
            position: relative;
            z-index: 2;
            background: rgba(25, 22, 18, 0.85);
            padding: 14px 35px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .sub-title-box p {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-title-box h1 {
                font-size: 2.8rem;
            }
            .sub-title-box p {
                font-size: 0.95rem;
                white-space: normal;
            }
        }

        @media (max-width: 768px) {
            .main-title-box {
                padding: 20px 15px;
            }
            .main-title-box h1 {
                font-size: 2rem;
            }
            .sub-title-box {
                padding: 10px 20px;
            }
            .sub-title-box p {
                font-size: 0.8rem;
                letter-spacing: 1px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Slide 1 -->
        <div class="hero-slide active" style="background-image: url('your-image-1.jpg');">
            <div class="main-title-box">
                <h1>Rimo Global Pharma<br>Ltd</h1>
            </div>
            <div class="sub-title-box">
                <p>Global Supplier of WHO-GMP Certified Oncology Medicines</p>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="hero-slide" style="background-image: url('your-image-2.jpg');">
            <div class="main-title-box">
                <h1>End-To-End Pharma Sourcing</h1>
            </div>
            <div class="sub-title-box">
                <p>Connecting Healthcare Demands Globally</p>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="hero-slide" style="background-image: url('your-image-3.jpg');">
            <div class="main-title-box">
                <h1>Accessible Global Healthcare</h1>
            </div>
            <div class="sub-title-box">
                <p>Facilitating Procurement & Export Logistics</p>
            </div>
        </div>
    </div>

    <script>
        // Automatic slide switcher script
        let currentSlide = 0;
        const slides = document.querySelectorAll('.hero-slide');

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 4500); // Change slide every 4.5 seconds
    </script>

</body>
</html>
