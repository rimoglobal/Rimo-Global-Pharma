<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-8">

    <!-- Search & Filter Controls -->
    <div id="products-section" class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
        <input type="text" id="search-input" placeholder="Search by brand or generic name..." class="w-full md:w-96 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
        
        <div class="flex gap-2">
            <button onclick="filterByCompany('All')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-xs font-bold rounded-lg">All Companies</button>
            <button onclick="filterByCompany('ZISKA PHARMACEUTICALS LTD.')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-xs font-bold rounded-lg">Ziska</button>
        </div>
    </div>

    <!-- Product Grid Container -->
    <div id="product-grid-container" class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- JS renders products here -->
    </div>

    <!-- Pagination Container -->
    <div id="pagination-container" class="max-w-7xl mx-auto mt-8 flex justify-center gap-2">
        <!-- JS renders pagination here -->
    </div>

    <!-- JavaScript Code inside Script Tag -->
    <script>
        const productsData = [
            { serial: 84, brand: "Ventex 100", generic: "Venetoclax", strength: "100 mg", company: "ZISKA PHARMACEUTICALS LTD.", image: "Ventex 100.jpg" }
            // Add more product objects here
        ];

        let currentPage = 1;
        const itemsPerPage = 12;
        let filteredProducts = [...productsData];

        function renderProducts(page = 1) {
            const grid = document.getElementById('product-grid-container');
            if (!grid) return;
            grid.innerHTML = '';

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredProducts.slice(start, end);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 font-semibold">No products found matching your query.</div>`;
                renderPagination(0);
                return;
            }

            paginatedItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-3 sm:p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="h-36 sm:h-44 bg-slate-100 rounded-lg mb-3 overflow-hidden flex items-center justify-center">
                            <img src="${item.image}" alt="${item.brand}" class="h-full w-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\"text-xs text-slate-400 font-medium\">Image Unavailable</span>';">
                        </div>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-100 block w-fit mb-1.5">${item.company}</span>
                        <h4 class="font-extrabold text-sm sm:text-base text-slate-900 leading-tight">${item.brand}</h4>
                        <p class="text-xs text-slate-600 font-medium mt-0.5">${item.generic}</p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-800">${item.strength}</span>
                        <a href="https://wa.me/8801944887517?text=Inquiry%20about%20${encodeURIComponent(item.brand)}" target="_blank" class="text-xs font-bold text-sky-600 hover:text-sky-800">Inquire →</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination(Math.ceil(filteredProducts.length / itemsPerPage));
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-container');
            if (!container) return;
            container.innerHTML = '';

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 text-xs font-bold rounded-lg transition ${i === currentPage ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderProducts(currentPage);
                    document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
                };
                container.appendChild(btn);
            }
        }

        document.getElementById('search-input')?.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filteredProducts = productsData.filter(p => 
                p.brand.toLowerCase().includes(query) || 
                p.generic.toLowerCase().includes(query)
            );
            currentPage = 1;
            renderProducts(currentPage);
        });

        function filterByCompany(company) {
            if (company === 'All') {
                filteredProducts = [...productsData];
            } else {
                filteredProducts = productsData.filter(p => p.company.toUpperCase().includes(company.toUpperCase()));
            }
            currentPage = 1;
            renderProducts(currentPage);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(1);
        });
    </script>
</body>
</html>
