<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Catalog</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Background CSS */
        body {
            background-image: url('cancer-cell-bg.jpg'); /* Make sure this path is correct */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .bg-overlay {
            background-color: rgba(15, 23, 42, 0.85); /* Dark slate overlay for readability */
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen relative">
    <div class="bg-overlay min-h-screen pb-12">
        
        <!-- Header Section -->
        <header class="container mx-auto px-4 py-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-blue-400 mb-2">Oncology & Special Care Products</h1>
            <p class="text-slate-300 text-lg">Browse through our available medicine database</p>
        </header>

        <!-- Search & Company Filter Section -->
        <div class="container mx-auto px-4 mb-8">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700">
                <!-- Search Input -->
                <div class="relative w-full md:w-1/2">
                    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search by Brand, Generic Name..." 
                           class="w-full pl-10 pr-4 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500 text-white placeholder-slate-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                </div>
                <!-- Company Filter Dropdown -->
                <div class="w-full md:w-1/3">
                    <select id="companySelect" onchange="handleCompanyFilter()" class="w-full py-2 px-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-blue-500 text-white">
                        <option value="All">All Companies</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Therapeutic Categories Buttons -->
        <div class="container mx-auto px-4 mb-8">
            <h2 class="text-xl font-semibold mb-3 text-slate-200">Therapeutic Categories</h2>
            <div class="flex flex-wrap gap-2">
                <button onclick="filterByDisease('All')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium text-sm">All</button>
                <button onclick="filterByDisease('Anti Cancer')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition font-medium text-sm">Anti Cancer</button>
                <button onclick="filterByDisease('Anti Diabetic')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition font-medium text-sm">Anti Diabetic</button>
                <button onclick="filterByDisease('Breast Cancer')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition font-medium text-sm">Breast Cancer</button>
                <button onclick="filterByDisease('Colorectal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition font-medium text-sm">Colorectal</button>
                <button onclick="filterByDisease('Leukemia')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition font-medium text-sm">Leukemia</button>
            </div>
        </div>

        <!-- Products Section -->
        <main id="products-section" class="container mx-auto px-4">
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Product cards dynamically loaded here -->
            </div>

            <!-- Pagination Controls -->
            <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
                <!-- Pagination buttons generated here -->
            </div>
        </main>
    </div>

    <!-- Floating Contact Menu Widget -->
    <div class="fixed bottom-6 right-6 z-50">
        <a href="https://wa.me/yournumber" target="_blank" class="flex items-center justify-center w-14 h-14 bg-green-500 hover:bg-green-600 text-white rounded-full shadow-lg transition duration-300 transform hover:scale-110">
            <i class="fa-brands fa-whatsapp text-2xl"></i>
        </a>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Sample Base Data with Category mapped correctly
        const baseProducts = [
            { 
                serial: 1, 
                brand: "Acaluxen", 
                generic: "Acalabrutinib INN", 
                strength: "100 mg", 
                company: "EVEREST PHARMACEUTICALS", 
                category: "Leukemia", 
                image: "Acaluxen 100 mg.jpg" 
            },
            { 
                serial: 2, 
                brand: "OncoNeb", 
                generic: "Paclitaxel", 
                strength: "200 mg", 
                company: "ONCO PHARMA", 
                category: "Breast Cancer", 
                image: "onconebe.jpg" 
            },
            { 
                serial: 3, 
                brand: "DiaCare", 
                generic: "Metformin HCl", 
                strength: "500 mg", 
                company: "HEALTH CARE", 
                category: "Anti Diabetic", 
                image: "diacare.jpg" 
            }
        ];

        // Generate full product list for pagination demonstration
        let productsData = [...baseProducts];
        for (let i = 4; i <= 30; i++) {
            productsData.push({
                serial: i,
                brand: `Medicine Brand ${i}`,
                generic: `Generic Formula ${i}`,
                strength: `${(i % 5 + 1) * 50} mg`,
                company: i % 2 === 0 ? "EVEREST PHARMACEUTICALS" : "ONCO PHARMA",
                category: i % 3 === 0 ? "Anti Cancer" : (i % 2 === 0 ? "Colorectal" : "Breast Cancer"),
                image: "placeholder.jpg"
            });
        }

        let filteredProducts = [...productsData];
        const itemsPerPage = 8;
        let currentPage = 1;

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            populateCompanies();
            renderProducts(1);
        });

        // Populate Company Dropdown
        function populateCompanies() {
            const companySelect = document.getElementById('companySelect');
            const companies = [...new Set(productsData.map(p => p.company))];
            companies.forEach(company => {
                const option = document.createElement('option');
                option.value = company;
                option.textContent = company;
                companySelect.appendChild(option);
            });
        }

        // Render Product Cards
        function renderProducts(page = 1) {
            currentPage = page;
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-lg">No products found.</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredProducts.slice(start, end);

            paginatedItems.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/90 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col justify-between hover:border-slate-500 transition duration-300";
                card.innerHTML = `
                    <div class="p-4">
                        <img src="${product.image}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150';" alt="${product.brand}" class="w-full h-48 object-cover rounded-lg mb-4 bg-slate-900">
                        <span class="inline-block px-2 py-1 bg-blue-900/50 text-blue-300 text-xs rounded border border-blue-700 mb-2">${product.category}</span>
                        <h3 class="text-xl font-bold text-blue-400">${product.brand}</h3>
                        <p class="text-slate-300 text-sm italic font-medium">${product.generic}</p>
                        <div class="mt-3 text-xs text-slate-400 space-y-1">
                            <p><strong class="text-slate-300">Strength:</strong> ${product.strength}</p>
                            <p><strong class="text-slate-300">Company:</strong> ${product.company}</p>
                        </div>
                    </div>
                    <div class="p-4 bg-slate-900/50 border-t border-slate-700/50">
                        <a href="https://wa.me/yournumber?text=Hi, I am interested in ${encodeURIComponent(product.brand)}" target="_blank" class="block text-center w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition text-sm">
                            Inquire Now
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination();
        }

        // Render Pagination
        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `px-3 py-1 rounded-md text-sm font-medium transition ${
                    i === currentPage 
                    ? 'bg-blue-600 text-white' 
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
                }`;
                btn.onclick = () => renderProducts(i);
                paginationContainer.appendChild(btn);
            }
        }

        // Search Handling
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedCompany = document.getElementById('companySelect').value;

            filteredProducts = productsData.filter(product => {
                const matchesSearch = product.brand.toLowerCase().includes(query) || 
                                      product.generic.toLowerCase().includes(query);
                const matchesCompany = selectedCompany === 'All' || product.company === selectedCompany;
                return matchesSearch && matchesCompany;
            });

            renderProducts(1);
        }

        // Filter by Company
        function handleCompanyFilter() {
            handleSearch(); // Reuse search logic to apply both filters
        }

        // Filter by Disease/Category
        function filterByDisease(categoryKeyword) {
            document.getElementById('searchInput').value = '';
            document.getElementById('companySelect').value = 'All';

            if (categoryKeyword === 'All') {
                filteredProducts = [...productsData];
            } else {
                filteredProducts = productsData.filter(product => 
                    product.category.toLowerCase() === categoryKeyword.toLowerCase() ||
                    product.brand.toLowerCase().includes(categoryKeyword.toLowerCase()) ||
                    product.generic.toLowerCase().includes(categoryKeyword.toLowerCase())
                );
            }
            renderProducts(1);
            document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
