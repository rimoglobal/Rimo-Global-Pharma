<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saif Pharma</title>
    <style>
        /* আপনার আগের ওয়েবসাইটের স্টাইল এখানে থাকবে */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        
        /* ফ্লোটিং উইজেট এর স্টাইল (নিচে যোগ করা হয়েছে) */
        .floating-chat-widget { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .chat-toggle-btn { width: 60px; height: 60px; background-color: #25d366; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .chat-options-list { position: absolute; bottom: 75px; right: 5px; display: flex; flex-direction: column; gap: 12px; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .chat-options-list.active { opacity: 1; visibility: visible; }
        .chat-option-item { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; }
        .phone { background-color: #007bff; }
        .whatsapp { background-color: #25d366; }
        .messenger { background-color: #0084ff; }
        .email { background-color: #ea4335; }
    </style>
</head>
<body>

    <!-- এখানে আপনার ওয়েবসাইটের আগের মূল কনটেন্টগুলো থাকবে -->
    <h1>SAIF PHARMA</h1>
    <p>Welcome to our official website.</p>

    <!-- ফ্লোটিং চ্যাট বাটন (এটি কোডের শেষে বসবে) -->
    <div class="floating-chat-widget">
        <div class="chat-toggle-btn" id="chatToggle">Menu</div>
        <div class="chat-options-list" id="chatOptions">
            <a href="tel:+8801944887517" class="chat-option-item phone">Call</a>
            <a href="https://wa.me/8801944887517" target="_blank" class="chat-option-item whatsapp">WA</a>
            <a href="https://www.facebook.com/rimoglobalpharma" target="_blank" class="chat-option-item messenger">FB</a>
            <a href="mailto:rimoglobalpharma@gmail.com" class="chat-option-item email">Mail</a>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('chatToggle');
        const options = document.getElementById('chatOptions');
        toggle.addEventListener('click', () => {
            options.classList.toggle('active');
        });
    </script>
</body>
</html>
